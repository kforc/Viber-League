name: Deploy to GitHub Pages

# Publishes the self-contained game (the `site/` directory built from the
# committed `Viber-League.html`) to GitHub Pages. No Cloudflare account,
# no wrangler, no token needed — the link goes live automatically on every
# push to main.
#
# Result: https://<user>.github.io/Viber-League/  (GitHub lowercases the
# repo name, so the URL is https://kforc.github.io/viber-league/).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel an in-flight one if a newer push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (pinned via package-lock.json)
        run: npm ci

      - name: Build the byte-reproducible bundle
        run: npm run bundle

      - name: Assemble the static deploy directory (site/)
        run: npm run prepare:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
