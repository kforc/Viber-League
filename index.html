<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="A mobile-first arcade football club game — one self-contained HTML file, no install. Pick your squad, choose your ground, and play."
    />

    <!-- Open Graph — the image path is relative and works once the repo is on
         GitHub Pages. For Discord/Telegram previews the absolute URL is better,
         so update og:image to the full Pages URL once the repo is pushed. -->
    <meta property="og:title" content="Viber League" />
    <meta
      property="og:description"
      content="A mobile-first arcade football club game — one self-contained HTML file, no install. Pick your squad, choose your ground, and play."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./docs/media/match.png" />

    <!-- Favicon: a lime circle with a black V, drawn as an inline SVG. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23dff902'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Arial,sans-serif' font-weight='bold' font-size='56' fill='%230c0f08'%3EV%3C/text%3E%3C/svg%3E"
    />

    <title>Viber League</title>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
